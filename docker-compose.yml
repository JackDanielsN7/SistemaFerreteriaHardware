services:
  mysql:
    image: mysql:8.0
    container_name: ferreteria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ferreteria_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ferreteria_hardware}
      MYSQL_USER: ${MYSQL_USER:-ferreteria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ferreteria123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ferreteria_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
