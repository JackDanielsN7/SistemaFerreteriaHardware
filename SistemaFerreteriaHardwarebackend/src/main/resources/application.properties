spring.application.name=SistemaFerreteriaHardware
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ferreteria_hardware}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD:ferreteria123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ===================================================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL en Docker)
# ===================================================================
# 1. Levanta la BD: docker compose up -d   (desde la raiz del proyecto)
# 2. Variables opcionales: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# 3. Hibernate crea las tablas de ferretería hardware en la base ferreteria_hardware

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CORS — origen del frontend Angular en desarrollo.
# En producción definir el dominio real (no usar * con credenciales).
# ===================================================================
app.cors.allowed-origins=http://localhost:4200

logging.level.com.example.sistemaferreteriahardware=INFO

# ===================================================================
# CONFIGURACION DE JWT (JSON Web Token)
# ===================================================================
# Clave secreta para firmar los tokens. Debe ser larga y segura en un entorno real!
sistema.ferreteria.jwtSecret=ClaveSecretaParaSistemaFerreteriaHardware2026!

# Tiempo de expiracion del token en milisegundos (24 horas)
sistema.ferreteria.jwtExpirationMs=86400000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always